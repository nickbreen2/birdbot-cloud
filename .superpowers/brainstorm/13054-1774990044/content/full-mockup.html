<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdBot Auth — Full Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0e1a;
    color: #f1f5f9;
    font-family: -apple-system, 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Star field */
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.08); }
    50% { opacity: var(--max-op, 0.25); }
  }

  /* Layout */
  .auth-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 380px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* Brand section */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .brand-logo {
    width: 48px;
    height: 48px;
    background: radial-gradient(circle at 35% 35%, #93c5fd, #2563eb);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(37,99,235,0.35), 0 4px 16px rgba(0,0,0,0.4);
  }
  .brand-logo svg { width: 28px; height: 28px; fill: white; }
  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #f1f5f9;
  }
  .brand-tagline {
    font-size: 13px;
    color: #64748b;
    text-align: center;
  }

  /* Clerk mock form */
  .clerk-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-title {
    font-size: 17px;
    font-weight: 600;
    color: #f1f5f9;
    margin-bottom: 14px;
  }
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 8px;
  }
  .field-label {
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 0.02em;
  }
  .field-input {
    width: 100%;
    height: 40px;
    background: rgba(255,255,255,0.04);
    border: 1px solid #1e2a45;
    border-radius: 6px;
    padding: 0 12px;
    color: #f1f5f9;
    font-size: 14px;
  }
  .field-input:focus { outline: none; border-color: #3b82f6; background: rgba(255,255,255,0.06); }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    color: #334155;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #1e2a45;
  }

  .social-btn {
    width: 100%;
    height: 40px;
    background: rgba(255,255,255,0.04);
    border: 1px solid #1e2a45;
    border-radius: 6px;
    color: #cbd5e1;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .google-icon {
    width: 16px; height: 16px;
    background: conic-gradient(from 90deg, #4285F4 0deg 90deg, #34A853 90deg 180deg, #FBBC05 180deg 270deg, #EA4335 270deg 360deg);
    border-radius: 50%;
  }

  .submit-btn {
    width: 100%;
    height: 40px;
    background: #2563eb;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.01em;
  }
  .submit-btn:hover { background: #1d4ed8; }

  .footer-text {
    font-size: 12px;
    color: #475569;
    text-align: center;
    margin-top: 8px;
  }
  .footer-text a { color: #3b82f6; text-decoration: none; }

  /* Tab switcher */
  .tabs {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid #1e2a45;
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
    width: 100%;
    max-width: 280px;
  }
  .tab {
    flex: 1;
    height: 28px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #64748b;
    transition: all 0.15s;
  }
  .tab.active {
    background: #111827;
    color: #f1f5f9;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  /* Annotation overlay */
  .annotation {
    position: absolute;
    background: rgba(37,99,235,0.15);
    border: 1px dashed rgba(59,130,246,0.5);
    border-radius: 4px;
    font-size: 10px;
    color: #60a5fa;
    padding: 2px 6px;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Star field -->
<div class="stars" id="stars"></div>

<!-- Auth page mockup -->
<div class="auth-container">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">
      <!-- Bird silhouette placeholder -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M23 5.5C21.5 6.5 19.5 7 17.5 7c-1 0-2-.15-3-.45C15.3 5.6 16 4.4 16 3c-1.5.8-3 1.3-4.5 1.3C9 4.3 7 3 5 3 3 3 1.5 4.5 1.5 6.5c0 2.5 2 4.5 4.5 4.5.8 0 1.6-.2 2.3-.6L12 21l7-9c1.5 0 3-.6 4-1.5V5.5z"/>
      </svg>
    </div>
    <div class="brand-name">BirdBot</div>
    <div class="brand-tagline">Sign in to continue</div>
  </div>

  <!-- Form -->
  <div class="clerk-form">
    <div class="social-btn">
      <div class="google-icon"></div>
      Continue with Google
    </div>
    <div class="divider">or</div>
    <div class="field-group">
      <div class="field-label">Email address</div>
      <input class="field-input" type="email" placeholder="you@example.com">
    </div>
    <div class="field-group">
      <div class="field-label">Password</div>
      <input class="field-input" type="password" placeholder="••••••••">
    </div>
    <button class="submit-btn">Continue</button>
    <div class="footer-text">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>

</div>

<script>
  // Generate stars
  const container = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < 0.7 ? 1 : Math.random() < 0.9 ? 1.5 : 2;
    const minOp = (0.04 + Math.random() * 0.08).toFixed(2);
    const maxOp = (parseFloat(minOp) + 0.1 + Math.random() * 0.12).toFixed(2);
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      --dur:${3+Math.random()*5}s;
      --delay:${(Math.random()*6).toFixed(1)}s;
      --min-op:${minOp};
      --max-op:${maxOp};
      opacity:${minOp};
    `;
    container.appendChild(s);
  }
</script>
</body>
</html>
